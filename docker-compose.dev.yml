name: portalgerencial-dev
# Stack local del Portal Gerencial SAP PM. Uso:
#   docker compose -f docker-compose.dev.yml up -d
# Puertos distintos a TPresto (3000/5400/5432) y Pago en Efectivo (3001/5401/5433) para poder
# correr los tres proyectos a la vez.
services:
  # Oracle Free — el mismo motor que producción (sección 9). La primera vez descarga la imagen
  # (~1.5 GB) y corre db/oracle/init/*.sql para crear los usuarios PGPM, SISTEMA_OT y los
  # usuarios nombrados de prueba. Conexión desde el host: localhost:1522/FREEPDB1.
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: portalgerencial-oracle-dev
    environment:
      ORACLE_PASSWORD: OracleLocal2026 # SYS/SYSTEM, solo local
      TZ: America/Santo_Domingo
    ports:
      - "1522:1521"
    volumes:
      - oracle_portalgerencial_dev_data:/opt/oracle/oradata
      - ./db/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - portalgerencial-dev

  # Backend API (.NET 8) — DataSourceMode=Local: Oracle Free + SAP simulado.
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.dev
    container_name: portalgerencial-api-dev
    environment:
      - TZ=America/Santo_Domingo
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5218
      - ASPNETCORE_HTTPS_PORT=
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DataSourceMode=Local
      # Alerta de datos desactualizados (sección 11): en local va a Mailpit, que no envía nada
      # afuera; los correos se ven en http://localhost:8025.
      - Alertas__Destinatarios=gerencia.taller@cac.local
      - Alertas__UrlPortal=http://localhost:3002
      - Alertas__Smtp__Host=mailpit
      - Alertas__Smtp__Puerto=1025
      - Alertas__Smtp__UsarSsl=false
      - Alertas__Smtp__Remitente=portal-gerencial@cac.local
    ports:
      - "5402:5218"
    volumes:
      - ./src/backend:/app:delegated
      - /app/PortalGerencialBackEnd.API/bin
      - /app/PortalGerencialBackEnd.API/obj
      - /app/PortalGerencialBackEnd.Core/bin
      - /app/PortalGerencialBackEnd.Core/obj
      - /app/PortalGerencialBackEnd.Infrastructure/bin
      - /app/PortalGerencialBackEnd.Infrastructure/obj
      - /app/PortalGerencialBackEnd.Tests/bin
      - /app/PortalGerencialBackEnd.Tests/obj
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - portalgerencial-dev
    restart: unless-stopped

  # Servidor de correo de prueba: atrapa los correos de alerta y los muestra en una bandeja web.
  mailpit:
    image: axllent/mailpit:latest
    container_name: portalgerencial-mailpit-dev
    ports:
      - "8025:8025"
    networks:
      - portalgerencial-dev
    restart: unless-stopped

  # Frontend (Next.js)
  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    container_name: portalgerencial-web-dev
    environment:
      - TZ=America/Santo_Domingo
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5402
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3002:3000"
    volumes:
      - ./src/frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - portalgerencial-dev
    restart: unless-stopped

volumes:
  oracle_portalgerencial_dev_data:
    driver: local

networks:
  portalgerencial-dev:
    driver: bridge
