name: portalgerencial-prod
# Despliegue en el servidor (Etapa 9; guía completa en docs/DESPLIEGUE.md). Uso:
#   cp .env.prod.example .env.prod   (y completar TODOS los valores)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Sin base de datos propia: todo vive en el Oracle de CAC (sección 9).
# Certificados TLS en deploy/certs/fullchain.pem y deploy/certs/privkey.pem.
services:
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      TZ: America/Santo_Domingo
      ASPNETCORE_ENVIRONMENT: Production
      DataSourceMode: ${DATA_SOURCE_MODE:-Production}
      ConnectionStrings__Oracle: User Id=${ORACLE_USUARIO_TECNICO};Password=${ORACLE_PASSWORD_TECNICO};Data Source=${ORACLE_DATA_SOURCE};
      Oracle__DataSourceLogin: ${ORACLE_DATA_SOURCE}
      Oracle__Esquema: ${ORACLE_ESQUEMA:-}
      Oracle__VersionSql: ${ORACLE_VERSION_SQL:-19}
      Database__AplicarMigracionesAlArrancar: ${APLICAR_MIGRACIONES:-true}
      Job__Habilitado: ${JOB_HABILITADO:-true}
      # SAP por servicios web (módulos Z_PM_MF_WS_* del ABAP).
      SapWs__BaseUrl: ${SAP_WS_URL:-}
      SapWs__Cliente: ${SAP_WS_CLIENTE:-}
      SapWs__Usuario: ${SAP_WS_USUARIO:-}
      SapWs__Password: ${SAP_WS_PASSWORD:-}
      SapWs__ValidarCertificado: ${SAP_WS_VALIDAR_CERTIFICADO:-true}
      SapWs__CertificadoCa: /certs-sap/ca_cac.cer
      Alertas__Destinatarios: ${ALERTA_DESTINATARIOS:-}
      Alertas__UrlPortal: ${PUBLIC_URL}
      Alertas__Smtp__Host: ${SMTP_HOST:-}
      Alertas__Smtp__Puerto: ${SMTP_PUERTO:-587}
      Alertas__Smtp__UsarSsl: ${SMTP_SSL:-true}
      Alertas__Smtp__Usuario: ${SMTP_USUARIO:-}
      Alertas__Smtp__Password: ${SMTP_PASSWORD:-}
      Alertas__Smtp__Remitente: ${SMTP_REMITENTE:-portal-gerencial@cac.com.do}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${PUBLIC_URL}
      Jwt__Audience: PortalGerencialApi
      Jwt__RequireHttpsMetadata: "true"
      AppSettings__FrontendUrl: ${PUBLIC_URL}
    volumes:
      # Raíz de la CA interna de CAC (deploy/certs-sap/ca_cac.cer) para validar el HTTPS de SAP.
      - ./deploy/certs-sap:/certs-sap:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/salud"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [portalgerencial]

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      TZ: America/Santo_Domingo
    depends_on: [api]
    networks: [portalgerencial]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # En el servidor de CAC el 443 ya lo usa Pago en Efectivo: el portal sale por PUERTO_HTTPS
    # (8443 por defecto). La plantilla recibe el puerto para que la redirección http→https lo conserve.
    environment:
      PUERTO_HTTPS: ${PUERTO_HTTPS:-8443}
      # SAP Fiori Launchpad que muestra el portal en un iframe (Content-Security-Policy
      # frame-ancestors): desarrollo, calidad y producción, separados por espacio.
      FIORI_ORIGEN: ${FIORI_ORIGEN:-https://vhazcwc1wd01.sap.cac.com:44380 https://vhazcwc1wd01.sap.cac.com:44381 https://vhazcwc3wd01.sap.cac.com:44380}
    ports:
      - "${PUERTO_HTTP:-8081}:80"
      - "${PUERTO_HTTPS:-8443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [portalgerencial]

networks:
  portalgerencial:
